<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seleccionar estudiante</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header header-interno">
    <div class="header-row">
      <div class="header-left">
        <a href="index.html" class="btn btn-ghost">← Volver</a>
      </div>

      <div class="header-center">Seleccionar estudiante</div>

      <div class="header-right">
        <!-- intencionalmente vacío -->
      </div>
    </div>
  </header>

  <main class="content">
    <div class="container">
      <section class="ejercicio-box">
        <select id="grupo">
          <option value="">Cargando grupos...</option>
        </select>

        <select id="estudiante">
          <option value="">Selecciona un grupo primero</option>
        </select>

        <input id="pin" type="password" inputmode="numeric" maxlength="4"
          placeholder="PIN (4 dígitos)" style="text-align:center"/>

        <button id="btn" class="btn btn-primary">Entrar</button>
        <p id="msg" class="meta"></p>
      </section>
    </div>
  </main>

  <script src="session.js"></script>
  <script src="seleccionar.js"></script>
</body>
</html>
