<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Temas por periodo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

  <div class="app-page-bg"></div>
  <div class="app-page-overlay"></div>
  <div class="page-glow page-glow-left"></div>
  <div class="page-glow page-glow-right"></div>

  <header class="header header-interno">
    <div class="header-row">
      <div class="header-left">
        <a id="btn-back" href="#" class="btn btn-ghost" style="display:none;">← Volver</a>
        <a id="btn-home" href="#" class="btn btn-ghost" style="display:none;">⌂ Inicio</a>
      </div>

      <div class="header-center" id="titulo-periodo">
        <div class="page-title-stack">
          <span class="page-kicker">Periodo académico</span>
          <span>Temas</span>
        </div>
      </div>

      <div class="header-right">
        <div id="session-badge"></div>
        <button id="btn-logout" class="btn btn-danger btn-logout" style="display:none;">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="page-hero compact-hero">
      <div class="page-hero-content">
        <div class="page-hero-icon">📚</div>
        <div>
          <h1 class="page-hero-title">Temas del periodo</h1>
          <p class="page-hero-subtitle">
            Selecciona el tema que deseas explorar y continúa con los subtemas disponibles.
          </p>
        </div>
      </div>
    </section>

    <div class="page-panel">
      <div class="section-head">
        <div>
          <h2 class="section-title">Listado de temas</h2>
          <p class="section-subtitle">
            Cada tarjeta te lleva al contenido organizado por subtemas.
          </p>
        </div>
      </div>

      <div id="temas-container" class="card-container"></div>
    </div>
  </main>

  <script src="session.js"></script>
  <script src="periodo.js"></script>
</body>
</html>
