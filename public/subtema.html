<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subtema</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="css/style.css">
  <!-- CSS SOLO de esta pantalla -->
  <link rel="stylesheet" href="css/subtema.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header-interno">
    <div class="header-row">
      <div class="header-left">
        <a class="btn btn-ghost" href="javascript:history.back()">← Volver</a>
      </div>

      <div class="header-center" id="titulo-subtema">Subtema</div>

      <div class="header-right">
        <button id="btn-logout" class="btn btn-danger btn-logout" style="display:none;">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="container">
      <section class="panel">

        <div class="tabs">
          <button class="tab active" data-tab="intro">Intro</button>
          <button class="tab" data-tab="taller">Taller</button>
          <button class="tab" data-tab="quiz">Quiz</button>
          <button class="tab" data-tab="practica">Práctica</button>
        </div>

        <div class="tabview active" id="tab-intro">
          <div id="intro-container"></div>
        </div>

        <div class="tabview" id="tab-taller">
          <div id="taller-container"></div>
        </div>

        <div class="tabview" id="tab-quiz">
          <div class="row">
            <button id="btn-cargar-quiz" class="btn btn-primary">Cargar 10 preguntas</button>
            <span id="quiz-meta" class="meta"></span>
          </div>
          <div id="quiz-container"></div>
        </div>

        <div class="tabview" id="tab-practica">
          <div class="practica-box">
            <h2 id="pregunta"></h2>

            <input type="text" id="respuesta" placeholder="Escribe tu respuesta">

            <div class="row">
              <button id="btn-validar" class="btn btn-primary">Responder</button>
              <button id="btn-saltar" class="btn btn-ghost">Saltar</button>

              <span class="meta">Puntaje: <b id="puntaje">0</b></span>
              <span class="meta">Respondidas: <b id="respondidas">0</b></span>
              <span class="meta">Intentos: <b id="intentos">0</b>/3</span>
            </div>

            <p id="resultado"></p>
          </div>
        </div>

      </section>
    </div>
  </main>

  <!-- Orden correcto -->
  <script src="session.js"></script>
  <script src="subtema.js"></script>

</body>
</html>
